<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Заказа Персонажа</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>🎨 Конструктор заказа рисунка</h1>
      <p>Выберите нужные детали, укажите референсы и скопируйте готовый BB-код</p>
    </header>

    <!-- СВЕРХУ: ИЗОБРАЖЕНИЕ-ПРИМЕР / ПРЕВЬЮ -->
    <section class="card preview-card">
      <h2>Превью / База</h2>
      <div class="art-preview-box">
        <img id="base-image" src="https://via.placeholder.com/800x400/e0f2fe/0369a1?text=Здесь+будет+ваша+основная+картинка-база" alt="База персонажа">
      </div>
    </section>

    <main class="main-layout">
      <!-- СЕКЦИЯ 1: ВЫБОР ДЕТАЛЕЙ ПЕРСОНАЖА -->
      <section class="card builder-card">
        <h2>1. Детали персонажа</h2>

        <div class="form-grid">

          <!-- Ресницы -->
          <div class="option-group">
            <label class="group-title">Ресницы</label>
            <div class="radio-buttons">
              <label><input type="radio" name="eyelashes" value="Да"> <span>Да</span></label>
              <label><input type="radio" name="eyelashes" value="–" checked> <span>Нет (–)</span></label>
            </div>
          </div>

          <!-- Румянец -->
          <div class="option-group">
            <label class="group-title">Румянец</label>
            <div class="inline-selects">
              <select id="blush-select" class="styled-select">
                <option value="–">Нет (–)</option>
                <option value="1">№1</option>
                <option value="2">№2</option>
                <option value="3">№3</option>
                <option value="4">№4</option>
                <option value="custom">Свой вариант</option>
              </select>
              <div class="color-picker-wrap">
                <label>Цвет:</label>
                <input type="color" id="blush-color" value="#ffb3ba">
              </div>
            </div>
            <input type="text" id="blush-custom-text" class="custom-input hidden" placeholder="Опишите свой вариант румянца...">
          </div>

          <!-- Уши -->
          <div class="option-group">
            <label class="group-title">Уши</label>
            <div class="inline-selects">
              <select id="ears-num" class="styled-select">
                <option value="–">Не выбрано</option>
                <option value="1">№1</option>
                <option value="2">№2</option>
                <option value="3">№3</option>
                <option value="4">№4</option>
                <option value="5">№5</option>
                <option value="6">№6</option>
                <option value="7">№7</option>
                <option value="custom">Свой вариант</option>
              </select>
              <select id="ears-type" class="styled-select">
                <option value="С шерстью">С шерстью</option>
                <option value="С кисточками">С кисточками</option>
                <option value="Без ничего">Без ничего</option>
              </select>
            </div>
            <input type="text" id="ears-custom-text" class="custom-input hidden" placeholder="Опишите свои уши...">
          </div>

          <!-- Щёки -->
          <div class="option-group">
            <label class="group-title">Щёки</label>
            <select id="cheeks-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="1">№1</option>
              <option value="2">№2</option>
              <option value="3">№3</option>
              <option value="4">№4</option>
              <option value="5">№5</option>
              <option value="6">№6</option>
              <option value="7">№7</option>
              <option value="8">№8</option>
              <option value="custom">Свой вариант</option>
            </select>
            <input type="text" id="cheeks-custom-text" class="custom-input hidden" placeholder="Опишите свой вариант щёк...">
          </div>

          <!-- Хохолок -->
          <div class="option-group">
            <label class="group-title">Хохолок</label>
            <select id="tuft-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="1">№1</option>
              <option value="2">№2</option>
              <option value="3">№3</option>
              <option value="4">№4</option>
              <option value="5">№5</option>
              <option value="custom">Свой вариант</option>
            </select>
            <input type="text" id="tuft-custom-text" class="custom-input hidden" placeholder="Опишите свой вариант хохолка...">
          </div>

          <!-- Чёлка -->
          <div class="option-group">
            <label class="group-title">Чёлка</label>
            <select id="bangs-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="1">№1</option>
              <option value="2">№2</option>
              <option value="3">№3</option>
              <option value="4">№4</option>
            </select>
          </div>

          <!-- Грива -->
          <div class="option-group">
            <label class="group-title">Грива</label>
            <select id="mane-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="1">№1</option>
              <option value="2">№2</option>
              <option value="3">№3</option>
              <option value="4">№4</option>
              <option value="5">№5</option>
              <option value="custom">Свой вариант</option>
            </select>
            <input type="text" id="mane-custom-text" class="custom-input hidden" placeholder="Опишите свой вариант гривы...">
          </div>

          <!-- Шерсть -->
          <div class="option-group">
            <label class="group-title">Шерсть</label>
            <select id="fur-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="На теле">На теле</option>
              <option value="На лапах">На лапах</option>
              <option value="На ушах">На ушах</option>
              <option value="custom">Свой вариант</option>
            </select>
            <input type="text" id="fur-custom-text" class="custom-input hidden" placeholder="Опишите вариант шерсти...">
          </div>

          <!-- Хвост -->
          <div class="option-group">
            <label class="group-title">Хвост</label>
            <select id="tail-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="1">№1</option>
              <option value="2">№2</option>
              <option value="3">№3</option>
              <option value="4">№4</option>
              <option value="5">№5</option>
              <option value="6">№6</option>
              <option value="7">№7</option>
              <option value="custom">Свой вариант</option>
            </select>
            <input type="text" id="tail-custom-text" class="custom-input hidden" placeholder="Опишите свой вариант хвоста...">
          </div>

          <!-- Усы -->
          <div class="option-group">
            <label class="group-title">Усы</label>
            <div class="inline-selects">
              <select id="whiskers-select" class="styled-select">
                <option value="–">Нет (–)</option>
                <option value="1">№1</option>
                <option value="2">№2</option>
                <option value="3">№3</option>
                <option value="4">№4</option>
                <option value="5">№5</option>
                <option value="custom">Свой вариант</option>
              </select>
              <div class="color-picker-wrap">
                <label>Цвет:</label>
                <input type="color" id="whiskers-color" value="#ffffff">
              </div>
            </div>
            <input type="text" id="whiskers-custom-text" class="custom-input hidden" placeholder="Опишите свои усы...">
          </div>

          <!-- Одежда -->
          <div class="option-group full-width">
            <label class="group-title">Одежда</label>
            <select id="clothes-select" class="styled-select">
              <option value="–">Без одежды (–)</option>
              <option value="Подгузник">Подгузник</option>
              <option value="Соска">Соска</option>
              <option value="Закрытый слип">Закрытый слип</option>
              <option value="Слип с рукавами">Слип с рукавами</option>
              <option value="Слип без рукавов">Слип без рукавов</option>
              <option value="custom">Свой вариант</option>
            </select>
            <input type="text" id="clothes-custom-text" class="custom-input hidden" placeholder="Опишите цвет, узор или свой вариант одежды...">
            
            <div id="clothes-file-wrap" class="file-attach-wrap hidden">
              <label>Прикрепить изображение одежды:</label>
              <input type="file" id="clothes-file" accept="image/*">
              <div id="clothes-preview" class="thumb-preview"></div>
            </div>
          </div>

          <!-- Игрушка -->
          <div class="option-group full-width">
            <label class="group-title">Игрушка</label>
            <select id="toy-select" class="styled-select">
              <option value="–">Без игрушки (–)</option>
              <option value="Медведь">Медведь</option>
              <option value="Кролик">Кролик</option>
              <option value="Кошка">Кошка</option>
              <option value="Собака">Собака</option>
              <option value="Тигр">Тигр</option>
              <option value="Дракон">Дракон</option>
              <option value="custom">Свой вариант / Свой цвет</option>
            </select>
            <input type="text" id="toy-custom-text" class="custom-input hidden" placeholder="Опишите свою игрушку или цвет...">
            
            <div id="toy-file-wrap" class="file-attach-wrap hidden">
              <label>Прикрепить изображение игрушки:</label>
              <input type="file" id="toy-file" accept="image/*">
              <div id="toy-preview" class="thumb-preview"></div>
            </div>
          </div>

        </div>
      </section>

      <!-- СЕКЦИЯ 2: ССЫЛКИ, АНКЕТА И СОЦ. СЕТИ -->
      <section class="card form-card">
        <h2>2. Данные персонажа и заказа</h2>

        <div class="input-field">
          <label>1. Ссылки на персонажа:</label>
          <div class="link-inputs">
            <input type="url" id="link-color" placeholder="Ссылка на Окрас">
            <input type="url" id="link-ref" placeholder="Ссылка на Референс">
            <input type="url" id="link-art" placeholder="Ссылка на Арт">
          </div>
        </div>

        <div class="input-field">
          <label>Прикрепить файл референса:</label>
          <input type="file" id="char-file" accept="image/*" multiple>
          <div id="char-preview-grid" class="preview-grid"></div>
        </div>

        <div class="input-field">
          <label>2. Уточнения к персонажу:</label>
          <textarea id="char-notes" rows="2" placeholder="Особенности, шрамы, пятна..."></textarea>
        </div>

        <div class="input-field">
          <label>4. Дополнения:</label>
          <textarea id="addons-text" rows="2" placeholder="Дополнительные детали..."></textarea>
        </div>

        <div class="grid-2col">
          <div class="input-field">
            <label>5. Обводка:</label>
            <select id="outline-select" class="styled-select">
              <option value="–">Нет (–)</option>
              <option value="Полупрозрачная">Полупрозрачная</option>
              <option value="custom">Цветная (указать цвет)</option>
            </select>
            <input type="text" id="outline-color" class="custom-input hidden" placeholder="Укажите цвет обводки...">
          </div>

          <div class="input-field">
            <label>6. Фон:</label>
            <select id="bg-select" class="styled-select">
              <option value="Без изменений">Без изменений</option>
              <option value="Другие цвета">Другие цвета</option>
              <option value="Другие элементы на фоне">Другие элементы на фоне</option>
              <option value="Прозрачный">Прозрачный</option>
              <option value="Однотонный">Однотонный</option>
            </select>
            <input type="text" id="bg-custom-color" class="custom-input hidden" placeholder="Укажите цвет фона...">
          </div>

          <div class="input-field">
            <label>7. Время суток:</label>
            <select id="time-select" class="styled-select">
              <option value="–">Не важно (–)</option>
              <option value="Утро">Утро</option>
              <option value="День">День</option>
              <option value="Вечер">Вечер</option>
              <option value="Ночь">Ночь</option>
            </select>
          </div>

          <div class="input-field">
            <label>8. Способ оплаты:</label>
            <select id="pay-select" class="styled-select">
              <option value="Кроли">Кроли</option>
              <option value="Рубли">Рубли</option>
            </select>
            <input type="url" id="pay-proof-link" placeholder="Ссылка на скриншот оплаты">
          </div>
        </div>

        <div class="input-field">
          <label>9. Куда прислать готовую работу:</label>
          <div class="inline-selects">
            <select id="social-select" class="styled-select">
              <option value="ВК">ВК</option>
              <option value="ТГ">ТГ</option>
              <option value="ЛС Вара">ЛС Вара</option>
            </select>
            <input type="text" id="social-link" placeholder="Ваша ссылка / логин (@username)">
          </div>
        </div>
      </section>
    </main>

    <!-- СЕКЦИЯ 3: ГОТОВЫЙ BB-КОД -->
    <section class="card code-card">
      <div class="code-header">
        <h2>3. Сформированный BB-код</h2>
        <button id="btn-copy" class="btn-copy">📋 Скопировать BB-код</button>
      </div>
      <textarea id="bbcode-output" readonly rows="16"></textarea>
      <div id="toast" class="toast">Скопировано в буфер обмена!</div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
